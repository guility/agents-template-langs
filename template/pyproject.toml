[project]
name = "ddd-python-project"
version = "0.1.0"
description = "DDD-based Python project with clean architecture"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.99",
]
test = [
    "mutmut==3.8.0",
    "cosmic-ray>=1.0",
    "testcontainers>=4.0",
]
security = [
    "pip-audit>=2.7",
    "safety>=3.0",
    "bandit>=1.7",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests/unit"]
on_dependency_change = "rerun"
