[package]
name = "ddd-rust-project"
version = "0.1.0"
edition = "2021"
description = "DDD-based Rust project with clean architecture"

[dependencies]
async-trait = "0.1"
# Domain layer should have minimal dependencies
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread"] }

[dev-dependencies]
testcontainers = "0.15"

[lib]
name = "ddd_rust_project"
path = "src/lib.rs"
